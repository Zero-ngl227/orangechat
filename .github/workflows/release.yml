name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                "android_client_info": { "package_name": "me.rerere.rikkahub" }
                },
                "api_key": [{ "current_key": "AIzaSyPlaceholderKey000000000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "me.rerere.rikkahub.liquidglass" }
                },
                "api_key": [{ "current_key": "AIzaSyPlaceholderKey000000000000000000" }]
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000002",
                  "android_client_info": { "package_name": "com.orangechat.app.liquidglass" }
                },
                "api_key": [{ "current_key": "AIzaSyPlaceholderKey000000000000000000" }]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Gradle Build Debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug -x :web:buildWebUi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: orangechat-liquidglass-debug
          path: app/build/outputs/apk/debug/*.apk
